    <main id="ecranLogin" class="login">
        <section>
            <h1>IRIS</h1>
            <form class="login__form" id="login-form">
                <label for="champToken">Token</label>
                <input type="password" id="champToken" placeholder="Token efe" autocomplete="off" required>
                <button type="submit" id="btnConnexion">Rejoindre</button>
            </form>
        </section>
    </main>


    <!-- CHAT -->
    <main id="chat-screen" class="chat" hidden>
        <aside class="chat__users" aria-label="Utilisateurs connectés">
            <h2>Utilisateurs</h2>
            <ul id="user-list"></ul>
        </aside>

        <section class="chat__main">
            <ul id="message-feed" class="chat__feed" aria-live="polite"></ul>

            <form id="message-form" class="chat__form">
                <input type="text" id="message-input" placeholder="Écris un message…" autocomplete="off" required>
                <button type="submit" class="btn">Envoyer</button>
            </form>
        </section>
    </main>

    <template id="message-template">
        <li class="message">
            <strong class="message__author"></strong>
            <p class="message__text"></p>
        </li>
    </template>

    <template id="join-template">
        <li class="join">
            <p class="join__prenom"></p>
            <p class="join__event"></p>
        </li>
    </template>

    <template id="user-template">
        <li class="user">
            <img class="user__photo" alt="">
            <p class="user__prenom"></p>
        </li>
    </template>

    <script src="script.js"></script>
